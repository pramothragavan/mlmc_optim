program: examples/examples_src/train.py
method: grid
parameters:
  # Experiment tracking
  wandb_exp_idx:
    values: [0]

  # Model parameters
  model:
    value: fno
  fno_modes:
    values: [8]
  fno_width:
    values: [32]
  in_channels:
    value: 3
  out_channels:
    value: 1

  # Data parameters
  data_dir:
    value: examples/pdes/darcy_flow/data
  dataset:
    value: darcy
  base_res:
    value: 241
  total_samples:
    value: 1024
  normalize:
    value: true
  add_coords:
    value: true
  use_grads:
    value: false

  c2f_resolutions:
    value: [241, 120, 60, 30]
  mixed_res_training:
    value: true
  mixed_res_mode:
    values: [uniform, mlmc_schedule]

  # Training parameters
  epochs:
    value: 500
  lr:
    value: 0.001
  loss_type:
    value: lp
  loss_reduction:
    value: sum
  device:
    value: gpu
  eval_every:
    value: 10
  eval_plot_every:
    value: 50
  batch_size:
    value: 20
  optimizer:
    value: adam
  weight_decay:
    value: 0.0001
  use_scheduler:
    value: true
  step_size:
    value: 100
  gamma:
    value: 0.5
  gradient_accumulation_steps:
    value: 1
  seed:
    value: 42

  # GPU/Memory
  load_in_memory:
    value: true
  load_gpu:
    value: true
  load_gpu_epoch:
    value: false
  pin_memory:
    value: false

  # Logging
  save_model:
    value: false
  save_wandb_artifact:
    value: false

command:
  - ${env}
  - python
  - ${program}
  - ${args}
  - --use_wandb
  - --wandb_sweep

entity: mlmc-optim
project: darcy_fno_mixed_batch