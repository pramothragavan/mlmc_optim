# MLMC Optim Configuration - Navier-Stokes Example

# Model
model: fno3d
fno_modes: 8
fno_width: 20
in_channels: 13  # T_in (10) + coords (3)
out_channels: 1

# Data
data_dir: examples/pdes/navier_stokes/data
dataset: navier_stokes
c2f_resolutions: [16, 32, 64]
base_res: 64
normalize: true
add_coords: true
load_in_memory: true
pin_memory: false
T_in: 10
T: 40

# MLMC
mlmc_pairing: hierarchy
mlmc_hierarchy_cache: true
mlmc_sampling_style: geom_prog
mlmc_data_size_multiplier: 2
mlmc_max_level: 3
mlmc_batch_style: geom_prog_batch
mlmc_batch_size_multiplier: 2
total_samples: 3000

# Training
epochs: 300
batch_size: 10
lr: 0.01
weight_decay: 0.0001
optimizer: adam
loss_type: lp
loss_reduction: mean
use_scheduler: true
step_size: 100
gamma: 0.5
device: mps
seed: 42
load_gpu: false
load_gpu_epoch: false
gradient_accumulation_steps: 1

# Logging
use_wandb: false
project_name: mlmc_optim
eval_every: 10
eval_grad_every: null
save_checkpoint: false
checkpoint_dir: ./checkpoints
