# ADR (Advection-Diffusion-Reaction) Example
# ParabolicCNN for advection-diffusion-reaction equations

# Model
model: parabolic
in_channels: 1
out_channels: 1
hidden_dim: 32
layer_dims: [32, 32]
override_res: 300
max_pool: false
operator_type: diagonal
rank: 4
advection: true

# Data
dataset: adr
data_dir: examples/pdes/adr/data
base_res: 300
c2f_resolutions: [75, 150, 300]
normalize: true
add_coords: false
use_grads: false

# MLMC
mlmc_pairing: hierarchy
mlmc_sampling_style: geom_prog
mlmc_data_size_multiplier: 2
mlmc_batch_style: geom_prog_batch
mlmc_batch_size_multiplier: 2
mlmc_hierarchy_cache: true
total_samples: 1000

# Training
batch_size: 20
epochs: 300
lr: 0.001
weight_decay: 0.0001
optimizer: adam
loss_type: mse
loss_reduction: mean
use_scheduler: true
step_size: 100
gamma: 0.5
device: gpu
seed: 42

# GPU/Memory
load_gpu: true
load_in_memory: true
load_gpu_epoch: false
pin_memory: false
gradient_accumulation_steps: 1

# Logging
use_wandb: false
project_name: mlmc_optim
eval_every: 5
eval_grad_every: null #1
eval_grad_mode: raw
eval_grad_rand: False
eval_grad_batches: 1
save_checkpoint: false
save_model: false